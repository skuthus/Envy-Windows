<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <div id="search-bar">
        <input
          id="search"
          type="text"
          placeholder="Search or create…"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="count"></span>
      </div>
      <div id="panes">
        <div id="list" role="listbox" aria-label="Notes"></div>
        <div
          id="divider"
          role="separator"
          aria-label="Resize panes"
          tabindex="0"
        ></div>
        <div id="editor-pane">
          <div id="note-title-bar">
            <span id="note-title"></span>
            <span id="note-due"></span>
          </div>
          <div id="editor"></div>
          <div id="empty-state">
            Type to search. Press Return to open the top match, or create a note
            from what you typed.
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
