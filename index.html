<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Envy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="app">
      <div id="search-bar">
        <input
          id="search"
          type="text"
          placeholder="Search or create…"
          autocomplete="off"
          spellcheck="false"
        />
        <span id="count"></span>
        <button id="settings-button" type="button" title="Settings (Ctrl+,)">
          Settings
        </button>
      </div>
      <div id="panes">
        <div id="list-pane">
          <div id="list-header" role="row"></div>
          <div id="list" role="listbox" aria-label="Notes"></div>
        </div>
        <div
          id="divider"
          role="separator"
          aria-label="Resize panes"
          tabindex="0"
        ></div>
        <div id="editor-pane">
          <div id="note-title-bar">
            <input
              id="note-title"
              type="text"
              spellcheck="false"
              autocomplete="off"
              aria-label="Note title"
              title="Click to rename. Links to this note are updated."
            />
            <span id="note-due"></span>
          </div>
          <div id="editor"></div>
          <div id="empty-state">
            Type to search. Press Return to open the top match, or create a note
            from what you typed.
          </div>
        </div>
      </div>

      <div id="settings" class="hidden" role="dialog" aria-label="Settings">
        <div id="settings-panel">
          <header>
            <h2>Settings</h2>
            <button id="settings-close" type="button" aria-label="Close">✕</button>
          </header>

          <section>
            <h3>The Index</h3>
            <p class="setting-path" id="settings-index-path"></p>
            <button id="settings-open-folder" type="button">Show in Explorer</button>
            <label>
              <input type="checkbox" id="setting-subfolders" />
              Include subfolders
            </label>
          </section>

          <section>
            <h3>Note list</h3>
            <label>
              <input type="checkbox" id="setting-preview" />
              Show note preview
            </label>
            <label>
              <input type="checkbox" id="setting-date" />
              Show date modified
            </label>
            <label>
              <input type="checkbox" id="setting-due" />
              Show due column
            </label>
          </section>

          <section>
            <h3>Appearance</h3>
            <label>
              Layout
              <select id="setting-layout">
                <option value="vertical">Vertical (list above note)</option>
                <option value="horizontal">Horizontal (list beside note)</option>
              </select>
            </label>
            <label>
              Theme
              <select id="setting-theme">
                <option value="system">Follow system</option>
                <option value="dark">Dark</option>
                <option value="light">Light</option>
              </select>
            </label>
          </section>
        </div>
      </div>
    </div>
  </body>
</html>
