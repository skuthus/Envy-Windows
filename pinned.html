<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinned note</title>
    <script type="module" src="/src/pinned.ts" defer></script>
  </head>

  <body class="popover">
    <div id="pinned-app">
      <div id="pinned-title-bar">
        <span id="pinned-title"></span>
        <button id="pinned-keep-open" type="button">📌</button>
        <button id="pinned-open" type="button" title="Open in Envy">Open</button>
      </div>
      <div id="pinned-editor"></div>
    </div>

    <!-- Shared with the main window: the app's own right-click menu (used by the
         image size/rename menu) and the in-app prompt (WebView2 has no
         window.prompt). The modules that drive these look the elements up by id. -->
    <div id="context-menu" class="hidden" role="menu"></div>
    <div id="prompt" class="hidden" role="dialog" aria-modal="true" aria-labelledby="prompt-message">
      <form id="prompt-panel" method="dialog">
        <label id="prompt-message" for="prompt-input"></label>
        <input id="prompt-input" type="text" autocomplete="off" spellcheck="false" />
        <div id="prompt-buttons">
          <button id="prompt-cancel" type="button">Cancel</button>
          <button id="prompt-ok" type="submit">OK</button>
        </div>
      </form>
    </div>
  </body>
</html>
